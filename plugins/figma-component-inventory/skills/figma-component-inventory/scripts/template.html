<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Découpage en composants</title>
    <style>
      :root {
        --page-background: #ffffff;
        --text: #1c2430;
        --text-muted: #5b6676;
        --halo: #ffffff;
        --loose-text: #d97706;
      }
      body {
        margin: 0;
        padding: 24px 32px 48px;
        background: var(--page-background);
        color: var(--text);
        font: 14px/1.4 system-ui, sans-serif;
      }
      h1 {
        margin: 0;
        font-size: 18px;
      }
      .fingerprint {
        margin: 4px 0 16px;
        color: var(--text-muted);
        font-size: 12px;
      }
      .approval {
        display: inline-block;
        margin: 8px 0 0;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        color: var(--halo);
        background: var(--to-decide);
      }
      .approval.approved {
        background: var(--reused);
      }
      .developer-words {
        color: var(--text);
        font-weight: 600;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 24px;
        margin: 0 0 16px;
        padding: 0;
        list-style: none;
      }
      .legend li {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--verdict);
        font-weight: 600;
      }
      .legend svg {
        width: 36px;
        height: 12px;
      }
      .not-outlined {
        color: var(--text-muted);
        font-size: 12px;
      }
      .screens svg {
        display: block;
        max-width: 100%;
        height: auto;
      }
      /* Every outline is dotted; only the colour tells the verdict. */
      .outline, .swatch {
        fill: none;
        stroke: var(--verdict);
        stroke-width: 2;
        stroke-dasharray: 2 3;
      }
      .explanations {
        max-width: 900px;
        margin: 24px 0 8px;
        padding: 0;
        list-style: none;
      }
      .explanations li {
        margin-bottom: 10px;
        padding-left: 12px;
        border-left: 3px solid var(--verdict);
      }
      .explanations strong {
        color: var(--verdict);
      }
      .outline-halo {
        fill: none;
        stroke: var(--halo);
        stroke-width: 4;
        stroke-opacity: 0.85;
      }
      .leader {
        stroke: var(--verdict);
        stroke-width: 1;
        stroke-dasharray: none;
      }
      .leader-end, .badge {
        fill: var(--verdict);
        stroke: none;
      }
      .badge-text {
        fill: var(--halo);
        stroke: none;
        font: 600 10px system-ui, sans-serif;
      }
      .label-title {
        fill: var(--verdict);
        stroke: none;
        font: 600 13px system-ui, sans-serif;
      }
      .label-detail {
        fill: var(--text-muted);
        stroke: none;
        font: 11px system-ui, sans-serif;
      }
      .screens {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 32px 16px;
      }
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: 0 0 16px;
      }
      .tabs:empty {
        display: none;
      }
      .tabs button {
        padding: 4px 12px;
        border: 1px solid var(--text-muted);
        border-radius: 999px;
        background: var(--page-background);
        color: var(--text);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .tabs button[aria-selected="true"] {
        background: var(--text);
        color: var(--page-background);
      }
      .tabs .tabs-hint {
        align-self: center;
        margin-left: 8px;
        color: var(--text-muted);
        font-size: 12px;
      }
      .page-switch {
        display: block;
        margin: 0 0 8px;
        cursor: pointer;
      }
      .page-switch[hidden] {
        display: none;
      }
      .screens {
        margin-top: 16px;
      }
      .page-hint {
        margin: 0 0 8px;
        color: var(--text-muted);
        font-size: 12px;
      }
      [data-candidate] {
        cursor: pointer;
      }
      .isolating [data-candidate]:not(.isolated),
      .isolating .loose-text {
        opacity: 0.12;
      }
      .isolation-mask {
        display: none;
        fill: var(--page-background);
        fill-opacity: 0.82;
        fill-rule: evenodd;
        stroke: none;
      }
      .isolating .isolation-mask {
        display: inline;
      }
      .loose-text {
        display: none;
      }
      .texts-outside-leaves .loose-text {
        display: inline;
      }
      .loose-text rect {
        fill: var(--loose-text);
        fill-opacity: 0.22;
        stroke: var(--loose-text);
        stroke-width: 1;
      }
      .loose-text .badge {
        fill: var(--loose-text);
        fill-opacity: 1;
        stroke: none;
      }
      .differences-only .same-on-every-screen {
        opacity: 0.12;
      }
      .screens h2 {
        margin: 0 0 8px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h1 id="screen-name"></h1>
    <p class="approval" id="approval"></p>
    <p class="fingerprint" id="fingerprint"></p>
    <ul class="legend" id="legend"></ul>
    <div class="tabs" id="tabs" role="tablist"></div>
    <label class="page-switch">
      <input type="checkbox" id="texts-outside-leaves" />
      Textes hors sous-composant : montrer chaque texte qu'aucun sous-composant ne contient
    </label>
    <label class="page-switch" id="differences-switch" hidden>
      <input type="checkbox" id="differences-only" />
      Différences seulement : estomper ce qui est identique sur tous les écrans
    </label>
    <p class="page-hint">
      Cliquer sur un composant, son étiquette ou sa raison pour l'isoler ; recliquer, cliquer à côté ou Échap pour
      revenir.
    </p>
    <div class="screens" id="screens"></div>
    <ul class="explanations" id="explanations"></ul>
    <p class="not-outlined" id="not-outlined"></p>
    <script>
      // Replaced by render.mjs with the screens, their captures and the judged candidates.
      const cut = /*CUT*/ null

      // Each verdict's colour comes with the data: "--reused" for the page's own rules, and
      // "--verdict" on any element that carries the verdict as a class.
      const verdictColours = document.createElement("style")
      verdictColours.textContent = cut.verdicts
        .map(({ key, color }) => `:root { --${key}: ${color}; } .${key} { --verdict: var(--${key}); }`)
        .join("\n")
      document.head.append(verdictColours)

      const LABEL_COLUMN_WIDTH = 300
      const LABEL_HEIGHT = 34
      const GAP_BETWEEN_LABELS = 8
      const GAP_BETWEEN_CAPTURE_AND_LABELS = 28
      const LABEL_DETAIL_OFFSET_Y = 15
      const BADGE_HEIGHT = 13
      const BADGE_CHARACTER_WIDTH = 6.5
      const BADGE_PADDING_X = 4
      const LEADER_END_RADIUS = 2.5
      const LEADER_OFFSET_Y = 9
      const FULL_WIDTH_SHARE = 0.8
      const LEADER_INSET = 12
      const GAP_BETWEEN_LEADERS = 10
      // A component thinner than this (a 1 px divider) gets its badge and its label, but no
      // outline: the outline would hide the component itself.
      const MIN_OUTLINED_THICKNESS = 4
      const SVG_NAMESPACE = "http://www.w3.org/2000/svg"

      function createSvgElement(name, attributes, text) {
        const element = document.createElementNS(SVG_NAMESPACE, name)
        for (const [attribute, value] of Object.entries(attributes)) element.setAttribute(attribute, value)
        if (text !== undefined) element.textContent = text
        return element
      }

      // One label per candidate and verdict: the instances of a candidate that an exception
      // judges differently get a label of their own.
      function buildLabels(candidates, verdictLabelsByKey) {
        const labels = []
        for (const candidate of candidates) {
          for (const instances of groupByJudgement(candidate.instances)) {
            const [{ verdict, codeComponent }] = instances
            const coversEveryInstance = instances.length === candidate.instances.length
            const outlineIds = instances.map((instance) => buildOutlineId(candidate, instance))
            const detail = [
              candidate.figmaName + (instances.length > 1 ? ` ×${instances.length}` : ""),
              verdictLabelsByKey.get(verdict),
            ]
            labels.push({
              candidateNumber: candidate.number,
              className: classOfCandidate(candidate, verdict),
              anchor: instances[0].box,
              title: `${coversEveryInstance ? candidate.number : outlineIds.join(" ")}  ${codeComponent ?? "?"}`,
              detail: detail.join(" · "),
            })
          }
        }
        return labels
      }

      // The instances of a candidate that share a verdict and a React component: several
      // groups when an exception judges some of them differently, or names another component.
      function groupByJudgement(instances) {
        return [...Map.groupBy(instances, (instance) => `${instance.verdict}\n${instance.codeComponent}`).values()]
      }

      function buildOutlineId(candidate, instance) {
        return candidate.instances.length > 1 ? `${candidate.number}${instance.letter}` : `${candidate.number}`
      }

      // Labels go to the column on the side of their component, in the component's vertical
      // order. A component as wide as the screen can go either side: it takes the emptier
      // column. Labels that would overlap are spread around the height of their components,
      // half upwards and half downwards, so that their lines stay short.
      // Returns the highest label's top and the lowest label's bottom.
      function placeLabels(labels, screen) {
        const centerX = (label) => label.anchor.x + label.anchor.width / 2
        const centerY = (label) => label.anchor.y + label.anchor.height / 2
        const isAsWideAsTheScreen = (label) => label.anchor.width > screen.width * FULL_WIDTH_SHARE
        const labelsBySide = { left: [], right: [] }
        for (const label of labels.filter((each) => !isAsWideAsTheScreen(each))) {
          labelsBySide[centerX(label) < screen.width / 2 ? "left" : "right"].push(label)
        }
        for (const label of labels.filter(isAsWideAsTheScreen).toSorted((a, b) => centerY(a) - centerY(b))) {
          labelsBySide[labelsBySide.left.length < labelsBySide.right.length ? "left" : "right"].push(label)
        }

        const step = LABEL_HEIGHT + GAP_BETWEEN_LABELS
        for (const [side, labelsOfSide] of Object.entries(labelsBySide)) {
          labelsOfSide.sort((a, b) => centerY(a) - centerY(b))
          const wishedTops = labelsOfSide.map((label) => centerY(label) - LABEL_HEIGHT / 2)
          const pushedDown = []
          wishedTops.forEach((top, index) => pushedDown.push(index ? Math.max(top, pushedDown[index - 1] + step) : top))
          const pushedUp = []
          wishedTops.toReversed().forEach((top, index) => pushedUp.push(index ? Math.min(top, pushedUp[index - 1] - step) : top))
          pushedUp.reverse()
          labelsOfSide.forEach((label, index) => {
            label.side = side
            label.top = (pushedDown[index] + pushedUp[index]) / 2
          })
        }
        return {
          highestTop: Math.min(...labels.map((label) => label.top)),
          lowestBottom: Math.max(...labels.map((label) => label.top + LABEL_HEIGHT)),
        }
      }

      // The line from a label to its component: straight when the label sits at the
      // component's height, otherwise horizontal then vertical, ending on the component's
      // top or bottom edge. Two vertical parts never share the same x.
      function routeLeaders(labels) {
        const verticalXsBySide = { left: [], right: [] }
        for (const label of labels.toSorted((a, b) => a.top - b.top)) {
          const { x, y, width, height } = label.anchor
          const isLeft = label.side === "left"
          const lineY = label.top + LEADER_OFFSET_Y
          if (lineY >= y && lineY <= y + height) {
            label.leaderEnd = { x: isLeft ? x : x + width, y: lineY }
            label.leaderCorner = null
            continue
          }
          const inset = Math.min(LEADER_INSET, width / 2)
          const towardsCenter = isLeft ? 1 : -1
          let verticalX = isLeft ? x + inset : x + width - inset
          const isTaken = (candidateX) =>
            verticalXsBySide[label.side].some((takenX) => Math.abs(takenX - candidateX) < GAP_BETWEEN_LEADERS)
          while (isTaken(verticalX) && Math.abs(verticalX - (x + width / 2)) < width / 2 - GAP_BETWEEN_LEADERS) {
            verticalX += towardsCenter * GAP_BETWEEN_LEADERS
          }
          verticalXsBySide[label.side].push(verticalX)
          label.leaderCorner = { x: verticalX, y: lineY }
          label.leaderEnd = { x: verticalX, y: lineY < y ? y : y + height }
        }
      }

      function drawOutline(layer, candidate, instance) {
        const { x, y, width, height } = instance.box
        const outlineId = buildOutlineId(candidate, instance)
        const badgeWidth = outlineId.length * BADGE_CHARACTER_WIDTH + BADGE_PADDING_X * 2
        const group = createSvgElement("g", {
          class: classOfCandidate(candidate, instance.verdict),
          "data-candidate": candidate.number,
        })
        if (Math.min(width, height) >= MIN_OUTLINED_THICKNESS) {
          group.append(
            createSvgElement("rect", { class: "outline-halo", x, y, width, height }),
            createSvgElement("rect", { class: "outline", x, y, width, height }),
          )
        }
        group.append(
          createSvgElement("rect", { class: "badge", x: x - 1, y: y - BADGE_HEIGHT, width: badgeWidth, height: BADGE_HEIGHT }),
          createSvgElement("text", { class: "badge-text", x: x - 1 + BADGE_PADDING_X, y: y - 3 }, outlineId),
        )
        layer.append(group)
      }

      function drawLabel(layer, label, screen) {
        const isLeft = label.side === "left"
        const captureEdge = isLeft ? screen.capture.x : screen.capture.x + screen.capture.width
        const textX = captureEdge + (isLeft ? -1 : 1) * GAP_BETWEEN_CAPTURE_AND_LABELS
        const titleY = label.top + LEADER_OFFSET_Y + 4
        const { leaderCorner, leaderEnd } = label
        const leaderPoints = [
          [leaderStartX(textX, isLeft), label.top + LEADER_OFFSET_Y],
          ...(leaderCorner ? [[leaderCorner.x, leaderCorner.y]] : []),
          [leaderEnd.x, leaderEnd.y],
        ]
        const textAnchor = isLeft ? "end" : "start"
        const group = createSvgElement("g", {
          class: label.className,
          "data-candidate": label.candidateNumber,
          "data-label": "",
        })
        group.append(
          createSvgElement("polyline", {
            class: "leader",
            fill: "none",
            points: leaderPoints.map((point) => point.join(",")).join(" "),
          }),
          createSvgElement("circle", { class: "leader-end", cx: leaderEnd.x, cy: leaderEnd.y, r: LEADER_END_RADIUS }),
          createSvgElement("text", { class: "label-title", x: textX, y: titleY, "text-anchor": textAnchor }, label.title),
          createSvgElement(
            "text",
            { class: "label-detail", x: textX, y: titleY + LABEL_DETAIL_OFFSET_Y, "text-anchor": textAnchor },
            label.detail,
          ),
        )
        layer.append(group)
      }

      // One image per screen, each with the outlines and labels of the candidates drawn on it.
      // With several screens, tabs show one screen at a time, all at the same place and
      // size: switching tab shows what changes from one screen to the next.
      function drawScreens() {
        const hasSeveralScreens = cut.screens.length > 1
        const verdictLabelsByKey = new Map(cut.verdicts.map(({ key, label }) => [key, label]))
        const drawnScreens = cut.screens.map((screen) => {
          const figmaLink = document.createElement("a")
          figmaLink.href = screen.figmaUrl
          figmaLink.textContent = hasSeveralScreens ? `Écran ${screen.number} — ${screen.name}` : "Ouvrir dans Figma"
          const title = document.createElement("h2")
          title.append(figmaLink)
          const svg = createSvgElement("svg", {})
          const section = document.createElement("section")
          section.append(title, svg)
          document.getElementById("screens").append(section)
          return { screen, section, svg, ownBox: drawScreen(svg, screen, verdictLabelsByKey) }
        })
        document.getElementById("texts-outside-leaves").addEventListener("change", (event) => {
          document.body.classList.toggle("texts-outside-leaves", event.target.checked)
        })
        if (hasSeveralScreens) {
          drawTabs(drawnScreens)
          document.getElementById("differences-switch").hidden = false
          document.getElementById("differences-only").addEventListener("change", (event) => {
            document.body.classList.toggle("differences-only", event.target.checked)
          })
        }
      }

      // The box that holds every screen's drawing, so that the screens' top-left corners
      // coincide when they are shown one at a time.
      function findCommonBox(boxes) {
        const left = Math.min(...boxes.map((box) => box.left))
        const top = Math.min(...boxes.map((box) => box.top))
        return {
          left,
          top,
          width: Math.max(...boxes.map((box) => box.left + box.width)) - left,
          height: Math.max(...boxes.map((box) => box.top + box.height)) - top,
        }
      }

      function showBox(svg, { left, top, width, height }) {
        svg.setAttribute("viewBox", `${left} ${top} ${width} ${height}`)
        svg.setAttribute("width", width)
      }

      // What the screens' names share is left out of the tabs: "Editor · Off" and
      // "Editor · Period" give "Off" and "Period".
      function shortenScreenNames(names) {
        const NAME_PART_SEPARATOR = " · "
        const partsOfNames = names.map((name) => name.split(NAME_PART_SEPARATOR))
        let sharedPartCount = 0
        while (
          partsOfNames.every((parts) => parts.length > sharedPartCount + 1) &&
          partsOfNames.every((parts) => parts[sharedPartCount] === partsOfNames[0][sharedPartCount])
        ) {
          sharedPartCount += 1
        }
        return partsOfNames.map((parts) => parts.slice(sharedPartCount).join(NAME_PART_SEPARATOR))
      }

      function drawTabs(drawnScreens) {
        const commonBox = findCommonBox(drawnScreens.map(({ ownBox }) => ownBox))
        const shortNames = shortenScreenNames(drawnScreens.map(({ screen }) => screen.name))
        const tabs = document.getElementById("tabs")
        const ALL_SCREENS = "all"
        const choices = [
          ...drawnScreens.map(({ screen }, index) => ({ shown: screen.number, text: `${screen.number} · ${shortNames[index]}` })),
          { shown: ALL_SCREENS, text: "Tous les écrans" },
        ]
        const buttons = choices.map(({ shown, text }) => {
          const button = document.createElement("button")
          button.type = "button"
          button.role = "tab"
          button.textContent = text
          button.addEventListener("click", () => show(shown))
          return button
        })
        const hint = document.createElement("span")
        hint.className = "tabs-hint"
        hint.textContent = "← → pour passer d'un écran à l'autre"
        tabs.append(...buttons, hint)

        let shownNow = null
        function show(shown) {
          shownNow = shown
          buttons.forEach((button, index) => button.setAttribute("aria-selected", String(choices[index].shown === shown)))
          for (const { screen, section, svg, ownBox } of drawnScreens) {
            section.hidden = shown !== ALL_SCREENS && shown !== screen.number
            showBox(svg, shown === ALL_SCREENS ? ownBox : commonBox)
          }
        }
        document.addEventListener("keydown", (event) => {
          const step = { ArrowRight: 1, ArrowLeft: -1 }[event.key]
          if (!step) return
          const index = choices.findIndex((choice) => choice.shown === shownNow)
          show(choices[(index + step + choices.length) % choices.length].shown)
        })
        show(choices[0].shown)
      }

      // A candidate is the same on every screen when it is drawn on each of them, holds the
      // same candidates and gets the same verdict and React component everywhere.
      function isSameOnEveryScreen(candidate) {
        const judgementsByScreen = cut.screens.map((screen) =>
          groupByJudgement(candidate.instances.filter((instance) => instance.screen === screen.number))
            .map(([{ verdict, codeComponent }]) => `${verdict} ${codeComponent}`)
            .toSorted()
            .join(" + "),
        )
        return (
          judgementsByScreen.every((judgements) => judgements !== "" && judgements === judgementsByScreen[0]) &&
          candidate.contentsThatDiffer.length === 0
        )
      }

      // The class that lets the "differences only" switch fade a candidate's drawing.
      function classOfCandidate(candidate, verdict) {
        return numbersSameOnEveryScreen.has(candidate.number) ? `${verdict} same-on-every-screen` : verdict
      }

      function drawScreen(svg, screen, verdictLabelsByKey) {
        const visibleCandidates = cut.candidates
          .filter((candidate) => candidate.outlined)
          .map((candidate) => ({
            ...candidate,
            instances: candidate.instances.filter((instance) => instance.screen === screen.number),
          }))
          .filter((candidate) => candidate.instances.length)
        const labels = buildLabels(visibleCandidates, verdictLabelsByKey)
        const { highestTop, lowestBottom } = placeLabels(labels, screen)
        routeLeaders(labels)

        const left = screen.capture.x - GAP_BETWEEN_CAPTURE_AND_LABELS - LABEL_COLUMN_WIDTH
        const width = screen.capture.width + 2 * (GAP_BETWEEN_CAPTURE_AND_LABELS + LABEL_COLUMN_WIDTH)
        const top = Math.min(screen.capture.y - BADGE_HEIGHT, highestTop - GAP_BETWEEN_LABELS)
        const height = Math.max(screen.capture.y + screen.capture.height, lowestBottom) - top + GAP_BETWEEN_LABELS
        showBox(svg, { left, top, width, height })
        const isolationMask = createSvgElement("path", { class: "isolation-mask" })
        svg.replaceChildren(
          createSvgElement("image", { href: screen.captureDataUrl, ...pickBox(screen.capture) }),
          isolationMask,
        )
        // Outer components first, so that a nested component's outline stays on top.
        const outlines = visibleCandidates
          .flatMap((candidate) => candidate.instances.map((instance) => ({ candidate, instance })))
          .toSorted((a, b) => a.instance.level - b.instance.level)
        for (const { candidate, instance } of outlines) drawOutline(svg, candidate, instance)
        for (const label of labels) drawLabel(svg, label, screen)
        drawLooseTexts(svg, screen, outlines)
        isolationMasks.push({ screen, outlines, isolationMask })
        svg.addEventListener("click", (event) => {
          const label = event.target.closest("[data-label]")
          isolate(label ? Number(label.dataset.candidate) : findCandidateAt(svg, outlines, event))
        })
        return { left, top, width, height }
      }

      // The candidate whose outline is the smallest one around the point clicked, or null.
      function findCandidateAt(svg, outlines, event) {
        const { x, y } = new DOMPoint(event.clientX, event.clientY).matrixTransform(svg.getScreenCTM().inverse())
        const area = ({ box }) => box.width * box.height
        const [smallest] = outlines
          .filter(({ instance: { box } }) => x >= box.x && x <= box.x + box.width && y >= box.y && y <= box.y + box.height)
          .toSorted((a, b) => area(a.instance) - area(b.instance))
        return smallest ? smallest.candidate.number : null
      }

      // Isolates one candidate on every screen: its outlines, labels and reason keep their
      // colour, everything else fades, and the capture is veiled except where the candidate
      // is drawn. Called with the same number again, or with null, shows everything back.
      function isolate(candidateNumber) {
        isolatedNumber = candidateNumber === isolatedNumber ? null : candidateNumber
        document.body.classList.toggle("isolating", isolatedNumber !== null)
        for (const element of document.querySelectorAll("[data-candidate]")) {
          element.classList.toggle("isolated", Number(element.dataset.candidate) === isolatedNumber)
        }
        for (const { screen, outlines, isolationMask } of isolationMasks) {
          const { x, y, width, height } = screen.capture
          const holes = outlines
            .filter(({ candidate }) => candidate.number === isolatedNumber)
            .map(({ instance: { box } }) => `M${box.x},${box.y}h${box.width}v${box.height}h${-box.width}z`)
          isolationMask.setAttribute("d", `M${x},${y}h${width}v${height}h${-width}z${holes.join("")}`)
        }
      }

      function isBoxInside(inner, outer) {
        return (
          inner.x >= outer.x &&
          inner.y >= outer.y &&
          inner.x + inner.width <= outer.x + outer.width &&
          inner.y + inner.height <= outer.y + outer.height
        )
      }

      // A text is "loose" when no sub-component holds it: the smallest outlined component
      // around it is the screen's outermost one (the dialog, the page), or there is none.
      // Each one is tinted and tagged with the number of that component ("?" when there is
      // none), shown on demand: a loose text may be a label or a help text that deserves a
      // component, or a prop of the component next to it.
      function drawLooseTexts(layer, screen, outlines) {
        const area = ({ box }) => box.width * box.height
        const isInsideAnother = (outline) =>
          outlines.some(
            (other) =>
              other !== outline &&
              area(other.instance) > area(outline.instance) &&
              isBoxInside(outline.instance.box, other.instance.box),
          )
        for (const text of screen.texts ?? []) {
          const [owner] = outlines
            .filter(({ instance }) => isBoxInside(text.box, instance.box))
            .toSorted((a, b) => area(a.instance) - area(b.instance))
          if (owner && isInsideAnother(owner)) continue
          const tag = owner ? `→ ${owner.candidate.number}` : "?"
          const tagWidth = tag.length * BADGE_CHARACTER_WIDTH + BADGE_PADDING_X * 2
          const { x, y, width, height } = text.box
          const group = createSvgElement("g", { class: "loose-text" })
          group.append(
            createSvgElement("title", {}, text.characters),
            createSvgElement("rect", { x, y, width, height }),
            createSvgElement("rect", { class: "badge", x: x + width, y, width: tagWidth, height: BADGE_HEIGHT }),
            createSvgElement("text", { class: "badge-text", x: x + width + BADGE_PADDING_X, y: y + BADGE_HEIGHT - 3 }, tag),
          )
          layer.append(group)
        }
      }

      function leaderStartX(textX, isLeft) {
        return textX + (isLeft ? 6 : -6)
      }

      function pickBox({ x, y, width, height }) {
        return { x, y, width, height }
      }

      function drawHeader() {
        const { fingerprint, screens } = cut
        const pageTitle = screens.length > 1 ? `${screens.length} écrans d'un même design` : screens[0].name
        document.title = `Découpage — ${pageTitle}`
        document.getElementById("screen-name").textContent = pageTitle
        const approval = document.getElementById("approval")
        approval.textContent = cut.approvalDate
          ? `Validé par le développeur le ${cut.approvalDate}`
          : "Brouillon — pas encore validé par le développeur"
        approval.classList.toggle("approved", Boolean(cut.approvalDate))
        document.getElementById("fingerprint").textContent =
          `Construit le ${fingerprint.createdAt} · maquette modifiée le ${fingerprint.figma.lastModified.slice(0, 10)} · commit ${fingerprint.gitCommit}`

        const legend = document.getElementById("legend")
        for (const { key, label } of cut.verdicts) {
          const swatch = createSvgElement("svg", { viewBox: "0 0 36 12" })
          swatch.append(createSvgElement("line", { class: `swatch ${key}`, x1: 0, y1: 6, x2: 36, y2: 6 }))
          const item = document.createElement("li")
          item.className = key
          item.append(swatch, label)
          legend.append(item)
        }

        const notOutlined = cut.candidates.filter((candidate) => !candidate.outlined)
        if (notOutlined.length) {
          document.getElementById("not-outlined").textContent =
            "Non entourés : " +
            notOutlined.map((candidate) => `${candidate.number} ${candidate.figmaName} (${candidate.note})`).join(" ; ")
        }
      }

      // Under the image: why a component is not simply reused (what has to change, why it is
      // left out, what the developer has to decide), one item per label that has a reason.
      function drawExplanations() {
        const verdictLabelsByKey = new Map(cut.verdicts.map(({ key, label }) => [key, label]))
        const list = document.getElementById("explanations")
        for (const candidate of cut.candidates.filter((each) => each.outlined)) {
          for (const instances of groupByJudgement(candidate.instances)) {
            const [{ verdict, codeComponent, developerDecision }] = instances
            const reason = verdict === "reused" ? null : instances[0].note
            if (!reason && developerDecision === null) continue
            const coversEveryInstance = instances.length === candidate.instances.length
            const title = document.createElement("strong")
            title.textContent = `${coversEveryInstance ? candidate.number : nameInstances(candidate, instances)} ${codeComponent ?? candidate.figmaName} — ${verdictLabelsByKey.get(verdict)}`
            const item = document.createElement("li")
            item.className = classOfCandidate(candidate, verdict)
            item.dataset.candidate = candidate.number
            item.addEventListener("click", () => isolate(candidate.number))
            item.append(title)
            if (reason) item.append(document.createElement("br"), reason)
            if (developerDecision !== null) {
              const decision = document.createElement("span")
              decision.className = "developer-words"
              decision.textContent = `Décidé par le développeur${developerDecision ? ` : ${developerDecision}` : ""}`
              item.append(document.createElement("br"), decision)
            }
            if (verdict === "to-decide") {
              item.append(document.createElement("br"), `${candidate.question} ${candidate.options.join(" / ")}`)
            }
            list.append(item)
          }
        }
      }

      // "17 · écrans 1 4" when the instances are everything the candidate has on those
      // screens, "6a 6b" otherwise.
      function nameInstances(candidate, instances) {
        const screenNumbers = [...new Set(instances.map((instance) => instance.screen))]
        const coversWholeScreens =
          candidate.instances.filter((instance) => screenNumbers.includes(instance.screen)).length === instances.length
        return cut.screens.length > 1 && coversWholeScreens
          ? `${candidate.number} · écran${screenNumbers.length > 1 ? "s" : ""} ${screenNumbers.join(" ")}`
          : instances.map((instance) => buildOutlineId(candidate, instance)).join(" ")
      }

      let isolatedNumber = null
      const isolationMasks = []
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && isolatedNumber !== null) isolate(null)
      })
      // A click beside the images and the reasons shows everything back; the page's own
      // controls (tabs, switches, links) leave the isolation as it is.
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".screens svg, [data-candidate], button, label, a")) isolate(null)
      })
      const numbersSameOnEveryScreen = new Set(
        cut.screens.length > 1 ? cut.candidates.filter(isSameOnEveryScreen).map((candidate) => candidate.number) : [],
      )
      drawHeader()
      drawScreens()
      drawExplanations()
    </script>
  </body>
</html>
