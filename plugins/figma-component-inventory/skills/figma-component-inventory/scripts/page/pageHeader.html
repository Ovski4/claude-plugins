<!-- The header of inventory.html and specs.html: what the page is about, where its approval
     stands, what it is built on, and its settings. render.mjs pastes it in place of the
     PAGE_HEADER comment of each page.html, with the page's own settings (the template
     "own-settings" of its page.html) in place of the OWN_SETTINGS comment. -->
<header class="page-header">
  <div>
    <h1 data-text="page.title"></h1>
    <p class="page-subject" id="screen-name"></p>
  </div>
  <div class="page-status">
    <p class="approval" id="approval"></p>
    <div class="status-buttons">
      <button
        type="button"
        class="info-bubble"
        data-text-aria-label="header.builtOn"
        aria-describedby="fingerprint"
      >
        i
      </button>
      <p class="fingerprint" id="fingerprint" role="tooltip"></p>
      <button
        type="button"
        class="settings-button"
        id="settings-button"
        data-text-aria-label="settings.title"
        aria-expanded="false"
        aria-controls="page-settings"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5" class="cog-teeth" />
          <circle cx="12" cy="12" r="6.5" />
          <circle cx="12" cy="12" r="2.5" />
        </svg>
      </button>
    </div>
    <div class="page-settings" id="page-settings" hidden>
      <h2 data-text="settings.title"></h2>
      <!--OWN_SETTINGS-->
    </div>
  </div>
</header>
