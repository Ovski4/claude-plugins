<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inventaire des composants</title>
    <style>
      /*PAGE_STYLES*/
    </style>
  </head>
  <body>
    <header class="page-header">
      <div>
        <h1>Inventaire des composants</h1>
        <p class="page-subject" id="screen-name"></p>
      </div>
      <div class="page-status">
        <p class="approval" id="approval"></p>
        <button
          type="button"
          class="info-bubble"
          aria-label="Sur quoi la page est construite"
          aria-describedby="fingerprint"
        >
          i
        </button>
        <p class="fingerprint" id="fingerprint" role="tooltip"></p>
      </div>
    </header>
    <ul class="legend" id="legend"></ul>
    <div class="tabs" id="tabs" role="tablist"></div>
    <label class="page-switch">
      <input type="checkbox" id="texts-outside-leaves" />
      Textes hors sous-composant : montrer chaque texte qu'aucun sous-composant
      ne contient
    </label>
    <label class="page-switch" id="differences-switch" hidden>
      <input type="checkbox" id="differences-only" />
      Différences seulement : estomper ce qui est identique sur tous les écrans
    </label>
    <p class="page-hint">
      Cliquer sur un composant, son étiquette ou sa raison pour l'isoler et le
      corriger ; recliquer, cliquer à côté ou Échap pour revenir.
    </p>
    <div class="capture-beside-panel">
      <div class="screens" id="screens"></div>
      <aside class="side-panel card">
        <h3>Composants</h3>
        <ul class="panel-items" id="explanations"></ul>
        <h3 id="not-outlined-heading" hidden>Non entourés</h3>
        <ul class="panel-items not-outlined" id="not-outlined"></ul>
      </aside>
    </div>
    <aside class="feedback" id="feedback">
      <form class="correction" id="correction" hidden>
        <p class="correction-title" id="correction-title"></p>
        <div
          class="correction-targets"
          id="correction-targets"
          role="tablist"
          aria-label="Ce que la correction concerne"
        ></div>
        <fieldset class="correction-choices" id="correction-verdicts">
          <legend>Verdict</legend>
        </fieldset>
        <fieldset
          class="correction-choices"
          id="correction-answers"
          hidden
        ></fieldset>
        <label>
          Composant React
          <input
            id="correction-component"
            list="components-named-in-inventory"
            autocomplete="off"
          />
          <datalist id="components-named-in-inventory"></datalist>
        </label>
        <label>
          Même composant que
          <select id="correction-same-as"></select>
        </label>
        <label class="correction-note">
          Note
          <input id="correction-note" autocomplete="off" />
        </label>
        <button type="button" id="correction-clear">
          Annuler cette correction
        </button>
      </form>
      <div class="feedback-summary">
        <p class="feedback-count" id="feedback-count"></p>
        <button type="button" id="feedback-copy" hidden>
          Copier les corrections
        </button>
        <button type="button" id="feedback-reset" class="quiet-action" hidden>
          Tout effacer
        </button>
        <ul class="feedback-lines" id="feedback-lines"></ul>
        <textarea id="feedback-text" rows="4" readonly hidden></textarea>
      </div>
    </aside>
    <!-- Written by render.mjs: everything the page draws, worked out by lib/pageDrawing.mjs. -->
    <script type="application/json" id="inventory">
      /*PAGE_DATA*/
    </script>
    <script>
      /*FEEDBACK_TEXT_MODULE*/
    </script>
    <script>
      /*PAGE_SCRIPT*/
    </script>
  </body>
</html>
