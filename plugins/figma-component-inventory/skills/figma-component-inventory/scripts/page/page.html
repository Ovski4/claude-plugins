<!doctype html>
<html lang="/*PROJECT_LANGUAGE*/">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <style>
      /*PAGE_STYLES*/
    </style>
  </head>
  <body>
    <!--PAGE_HEADER-->
    <template id="own-settings">
      <label class="page-switch">
        <input type="checkbox" id="texts-outside-leaves" />
        <span data-text="settings.textsOutsideLeaves"></span>
      </label>
      <label class="page-switch" id="differences-switch" hidden>
        <input type="checkbox" id="differences-only" />
        <span data-text="settings.differencesOnly"></span>
      </label>
      <label class="page-switch">
        <input type="checkbox" id="hide-out-of-scope" />
        <span data-text="settings.hideOutOfScope"></span>
      </label>
    </template>
    <ul class="legend" id="legend"></ul>
    <div class="tabs" id="tabs" role="tablist"></div>
    <p class="page-hint" data-text="page.hint"></p>
    <div class="capture-beside-panel">
      <div class="screens" id="screens"></div>
      <aside class="side-panel card">
        <h3 data-text="panel.components"></h3>
        <p class="page-hint" id="out-of-scope-left-out" hidden></p>
        <ul class="panel-items" id="explanations"></ul>
        <h3 id="not-outlined-heading" data-text="panel.notOutlined" hidden></h3>
        <ul class="panel-items not-outlined" id="not-outlined"></ul>
      </aside>
    </div>
    <aside class="feedback" id="feedback">
      <form class="correction" id="correction" hidden>
        <p class="correction-title" id="correction-title"></p>
        <div
          class="correction-targets"
          id="correction-targets"
          role="tablist"
          aria-label="Ce que la correction concerne"
        ></div>
        <fieldset class="correction-choices" id="correction-verdicts">
          <legend data-text="correction.verdict"></legend>
        </fieldset>
        <fieldset
          class="correction-choices"
          id="correction-answers"
          hidden
        ></fieldset>
        <label>
          <span data-text="correction.component"></span>
          <input
            id="correction-component"
            list="components-named-in-inventory"
            autocomplete="off"
          />
          <datalist id="components-named-in-inventory"></datalist>
        </label>
        <label>
          <span data-text="correction.sameAs"></span>
          <select id="correction-same-as"></select>
        </label>
        <label class="correction-note">
          <span data-text="correction.note"></span>
          <input id="correction-note" autocomplete="off" />
        </label>
        <button
          type="button"
          id="correction-clear"
          data-text="correction.clear"
        ></button>
      </form>
      <div class="feedback-summary">
        <p class="feedback-count" id="feedback-count"></p>
        <button
          type="button"
          id="feedback-copy"
          hidden
          data-text="corrections.copy"
        ></button>
        <button
          type="button"
          id="feedback-reset"
          class="quiet-action"
          hidden
          data-text="corrections.reset"
        ></button>
        <ul class="feedback-lines" id="feedback-lines"></ul>
        <textarea id="feedback-text" rows="4" readonly hidden></textarea>
      </div>
    </aside>
    <!-- Written by render.mjs: everything the page draws, worked out by lib/pageDrawing.mjs. -->
    <script type="application/json" id="inventory">
      /*PAGE_DATA*/
    </script>
    <script>
      /*FEEDBACK_TEXT_MODULE*/
    </script>
    <script>
      /*PAGE_SCRIPT*/
    </script>
  </body>
</html>
