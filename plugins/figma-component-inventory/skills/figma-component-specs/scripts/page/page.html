<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <style>
      /*PAGE_STYLES*/
    </style>
  </head>
  <body>
    <header class="page-header">
      <div>
        <h1 data-text="page.title"></h1>
        <p class="page-subject" id="screen-name"></p>
      </div>
      <div class="page-status">
        <p class="approval" id="approval"></p>
        <div class="status-buttons">
          <button
            type="button"
            class="info-bubble"
            data-text-aria-label="header.builtOn"
            aria-describedby="fingerprint"
          >
            i
          </button>
          <p class="fingerprint" id="fingerprint" role="tooltip"></p>
          <button
            type="button"
            class="settings-button"
            id="settings-button"
            data-text-aria-label="settings.title"
            aria-expanded="false"
            aria-controls="page-settings"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5" class="cog-teeth" />
              <circle cx="12" cy="12" r="6.5" />
              <circle cx="12" cy="12" r="2.5" />
            </svg>
          </button>
        </div>
        <div class="page-settings" id="page-settings" hidden>
          <h2 data-text="settings.title"></h2>
        </div>
      </div>
    </header>
    <ul class="legend" id="legend"></ul>
    <p class="page-hint" data-text="page.hint"></p>
    <div class="capture-beside-panel">
      <nav class="component-tree" data-text-aria-label="tree.title">
        <h3 data-text="tree.title"></h3>
        <div id="component-tree"></div>
        <ul class="tree-legend" id="tree-legend"></ul>
      </nav>
      <figure class="card">
        <div
          class="tabs"
          id="screen-tabs"
          role="tablist"
          data-text-aria-label="screen.tabs"
        ></div>
        <figcaption id="screen-caption"></figcaption>
        <div class="cut" id="cut"></div>
        <div id="screen-review"></div>
      </figure>
      <section class="side-panel card" id="panel" aria-live="polite"></section>
    </div>
    <aside class="feedback" id="feedback">
      <form class="correction" id="correction">
        <p class="correction-title" id="correction-title"></p>
        <fieldset
          class="correction-choices"
          id="correction-answers"
          hidden
        ></fieldset>
        <label class="correction-note">
          <span data-text="correction.note"></span>
          <input id="correction-note" autocomplete="off" />
        </label>
        <button
          type="button"
          id="correction-clear"
          hidden
          data-text="correction.clear"
        ></button>
      </form>
      <div class="feedback-summary">
        <p class="feedback-count" id="feedback-count"></p>
        <button
          type="button"
          id="feedback-copy"
          hidden
          data-text="corrections.copy"
        ></button>
        <button
          type="button"
          id="feedback-reset"
          class="quiet-action"
          hidden
          data-text="corrections.reset"
        ></button>
        <ul class="feedback-lines" id="feedback-lines"></ul>
        <textarea id="feedback-text" rows="4" readonly hidden></textarea>
      </div>
    </aside>
    <!-- Written by render.mjs: everything the page draws, worked out by lib/specsPageDrawing.mjs. -->
    <script type="application/json" id="specs">
      /*PAGE_DATA*/
    </script>
    <script>
      /*FEEDBACK_TEXT_MODULE*/
    </script>
    <script>
      /*PAGE_SCRIPT*/
    </script>
  </body>
</html>
